name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag name (e.g. v0.10.4-zh-Hans)'
        required: false
        default: 'v0.10.4-zh-Hans'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  MACOSX_DEPLOYMENT_TARGET: '15.0'

jobs:
  release:
    name: Build & Publish Multi-Arch Release Assets
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select latest Xcode
        run: |
          LATEST_XCODE="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -n "${LATEST_XCODE}" ]; then
            echo "Selecting ${LATEST_XCODE}"
            sudo xcode-select -s "${LATEST_XCODE}/Contents/Developer"
          fi
          xcodebuild -version
          swift --version

      - name: Cache SwiftPM build artifacts
        uses: actions/cache@v4
        with:
          path: |
            .build/repositories
            .build/checkouts
            .build/artifacts
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Build Universal Release Bundle (arm64 + x86_64)
        run: |
          chmod +x Scripts/*.sh
          ./Scripts/package_app.sh release

      - name: Package Multi-Arch Installers (DMG, ZIP, CLI tar.gz, appcast.xml, SHA256SUMS)
        env:
          RELEASE_VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.tag || 'v0.10.4-zh-Hans' }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          ./Scripts/package_release_assets.sh

      - name: Upload build artifacts to workflow run
        uses: actions/upload-artifact@v4
        with:
          name: RepoBar-${{ github.event_name == 'push' && github.ref_name || inputs.tag || 'v0.10.4-zh-Hans' }}-Installers
          path: dist/*
          if-no-files-found: error

      - name: Publish to GitHub Releases and update appcast.xml on main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event_name == 'push' && github.ref_name || inputs.tag || 'v0.10.4-zh-Hans' }}
        run: |
          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            echo "Uploading assets to existing release ${TAG_NAME}..."
            gh release upload "${TAG_NAME}" dist/* --clobber
          else
            echo "Creating new release ${TAG_NAME}..."
            gh release create "${TAG_NAME}" dist/* \
              --title "RepoBar ${TAG_NAME} 简体中文完整汉化版 (Simplified Chinese Edition)" \
              --generate-notes
          fi

          if [ -f dist/appcast.xml ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git fetch origin main
            git checkout -B main origin/main
            cp dist/appcast.xml appcast.xml
            if ! git diff --quiet appcast.xml; then
              git add appcast.xml
              git commit -m "chore(appcast): update Sparkle feed for ${TAG_NAME}"
              git push origin main
            fi
          fi
